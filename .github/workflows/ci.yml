name: Python SDK CI


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:


env:
  PYTHON_VERSION: "3.14"


jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          pip install -r requirements.txt

      - name: Run ruff linting
        run: ruff check .

      - name: Run black formatting check
        run: black --check .

      - name: Run mypy type checking
        run: mypy sekha --ignore-missing-imports
        continue-on-error: true


  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=sekha --cov-report=xml --cov-report=term-missing

      - name: Check coverage threshold
        if: matrix.python-version == '3.14'
        run: |
          coverage report --fail-under=100

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: python-sdk-py${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


  integration-test:
    name: Integration Test with Controller
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout SDK
        uses: actions/checkout@v6
        with:
          repository: sekha-ai/sekha-python-sdk
          path: sdk

      - name: Checkout controller
        uses: actions/checkout@v6
        with:
          repository: sekha-ai/sekha-controller
          path: controller

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Start ChromaDB
        run: |
          echo "🚀 Starting ChromaDB..."
          docker run -d \
            --name chroma \
            -p 8000:8000 \
            chromadb/chroma:0.4.24
          
          echo "⏳ Waiting for ChromaDB..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/v1/heartbeat > /dev/null 2>&1; then
              echo "✅ ChromaDB is ready (attempt $i/30)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ ChromaDB timeout"
              exit 1
            fi
            sleep 2
          done

      - name: Build controller
        working-directory: controller
        run: |
          cargo build --release --bin sekha-controller

      - name: Create controller config
        working-directory: controller
        run: |
          mkdir -p data
          
          cat > config.toml << 'EOF'
          config_version = "v0.2.0"
          
          server_host = "0.0.0.0"
          server_port = 8080
          mcp_api_key = "sk-sekha-test-token-123456789012345678901234567890"
          rest_api_key = "test-token-123"
          database_url = "sqlite:///home/runner/work/sekha-python-sdk/sekha-python-sdk/controller/data/sekha.db?mode=rwc"
          ollama_url = "http://localhost:11434"
          chroma_url = "http://localhost:8000"
          embedding_model = "nomic-embed-text:latest"
          max_connections = 10
          log_level = "info"
          
          [[llm_providers]]
          id = "ollama_ci"
          type = "ollama"
          base_url = "http://localhost:11434"
          timeout_secs = 120
          priority = 1
          EOF

      - name: Start controller
        working-directory: controller
        env:
          RUST_LOG: info
        run: |
          echo "🚀 Starting controller..."
          ./target/release/sekha-controller > ${{ runner.temp }}/controller.log 2>&1 &
          CONTROLLER_PID=$!
          echo "CONTROLLER_PID=$CONTROLLER_PID" >> $GITHUB_ENV
          
          echo "⏳ Waiting for controller..."
          for i in {1..60}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Controller is healthy (attempt $i/60)"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Controller timeout"
              cat ${{ runner.temp }}/controller.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Install SDK and run integration tests
        working-directory: sdk
        env:
          SEKHA_INTEGRATION_TESTS: "1"
          SEKHA_BASE_URL: http://localhost:8080
          SEKHA_API_KEY: sk-sekha-test-token-123456789012345678901234567890
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r requirements.txt
          pip install -e .
          
          pytest tests/ -v -k "test_all_endpoints or test_create_conversation"

      - name: Cleanup
        if: always()
        run: |
          if [ ! -z "$CONTROLLER_PID" ]; then
            kill $CONTROLLER_PID || true
          fi
          docker stop chroma || true
          docker rm chroma || true


  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt

      - name: Run safety check
        run: safety check --json
        continue-on-error: true

      - name: Run bandit security linter
        run: bandit -r sekha -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v6
        with:
          name: bandit-security-report
          path: bandit-report.json


  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Linting failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" == "failure" ]; then
            echo "Security audit had issues"
          fi
          echo "All required checks passed"
