name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      # Rust security
      - name: Rust security audit
        if: hashFiles('Cargo.toml') != ''
        run: |
          cargo install cargo-audit cargo-deny
          cargo audit
          cargo deny check
      
      # Python security - scan only project dependencies from pyproject.toml
      - name: Python security scan
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit pip-requirements-parser
          # Extract dependencies from pyproject.toml into requirements format
          python -c "
import tomllib
with open('pyproject.toml', 'rb') as f:
    data = tomllib.load(f)
    deps = data.get('project', {}).get('dependencies', [])
    for dep in deps:
        print(dep)
" > /tmp/project-deps.txt
          # Audit only project dependencies
          pip-audit --requirement /tmp/project-deps.txt --desc || true
          # Bandit for code security issues
          bandit -r sekha/ -ll || true
      
      # JavaScript security
      - name: npm audit
        if: hashFiles('package.json') != ''
        run: npm audit
      
      # Container security
      - name: Trivy scan
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results
        if: hashFiles('Dockerfile') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
